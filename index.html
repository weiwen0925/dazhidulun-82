<style>
:root{
  --bg:#f7f3ec;--text:#2c2416;--text2:#5a4e3a;--text-muted:#6B5B4B;
  --accent:#8b5e3c;--accentL:#c4956a;--accent-red:#8B2500;
  --gold:#b8860b;--goldL:#d4a84b;--gold-light:#C9A84C;
  --border:#d4c4a8;--border-light:#EDE8E0;--card:#fffdf7;
  --verseBg:#f0e8d8;--verseBd:#c4956a;
  --sbW:104px;--sbBg:#1e1a14;--sbText:#d4c4a8;
  --headGrad:linear-gradient(135deg,#2a2218 0%,#3d3225 50%,#2a2218 100%);
  --r:8px;
}
*{box-sizing:border-box;}
html,body{scrollbar-width:none;-ms-overflow-style:none;}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:"Noto Serif TC","Source Han Serif TC","Songti TC",Georgia,serif;
  font-size:20px;line-height:1.8;
  -webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;
  -webkit-touch-callout:none;}

/* ── 側欄 ── */
#sb{position:fixed;left:0;top:0;width:var(--sbW);height:100vh;
  background:var(--sbBg);color:var(--sbText);z-index:100;
  display:flex;flex-direction:column;align-items:center;
  padding:0 0 16px;overflow-y:auto;scrollbar-width:none;}
#sb::-webkit-scrollbar{display:none;}
.sb-head{position:sticky;top:0;width:100%;background:var(--sbBg);z-index:6;
  padding:13px 6px 10px;border-bottom:1px solid rgba(184,134,11,.25);}
.sb-brand{display:block;text-align:center;text-decoration:none;cursor:pointer;
  font-family:"Noto Sans TC",sans-serif;line-height:1.45;
  transition:color .25s;}
.sb-brand:hover{color:var(--goldL);}
.sb-brand .l1{display:block;font-size:11.5px;letter-spacing:1.5px;color:var(--gold);opacity:.82;}
.sb-brand .l2{display:block;font-size:14px;font-weight:700;letter-spacing:2px;color:var(--goldL);margin-top:2px;}
.sb-quick{display:flex;flex-direction:column;align-items:center;gap:5px;margin-top:9px;}
.sb-qbtn{display:block;width:86%;text-align:center;text-decoration:none;cursor:pointer;
  font-family:"Noto Sans TC",sans-serif;font-size:11.5px;letter-spacing:1px;
  color:var(--goldL);border:1px solid rgba(184,134,11,.45);
  background:rgba(184,134,11,.12);border-radius:13px;padding:3px 0;
  transition:background .2s,color .2s;}
.sb-qbtn:hover{background:rgba(184,134,11,.28);color:#fff;}
.sb-now{margin-top:10px;padding:7px 6px 2px;width:100%;text-align:center;}
.sb-now-lbl{display:block;font-family:"Noto Sans TC",sans-serif;font-size:10px;
  letter-spacing:2px;color:var(--gold);opacity:.7;}
.sb-now-name{display:block;font-family:"Noto Sans TC",sans-serif;font-size:12px;
  color:var(--sbText);margin-top:3px;line-height:1.4;min-height:14px;}
.sb-now-bar{width:80%;height:3px;margin:6px auto 0;background:rgba(212,196,168,.2);
  border-radius:2px;overflow:hidden;}
.sb-now-fill{display:block;height:100%;width:0%;
  background:linear-gradient(90deg,var(--gold),var(--goldL));transition:width .25s;}
.sb-nav{display:flex;flex-direction:column;align-items:stretch;gap:3px;width:100%;
  padding:9px 7px 0;}
.sb-item{display:flex;flex-direction:column;align-items:center;gap:3px;
  text-decoration:none;color:var(--sbText);padding:6px 3px;border-radius:9px;
  transition:background .2s,color .2s;}
.sb-item:hover{background:rgba(184,134,11,.16);}
.sb-item.active{background:rgba(184,134,11,.9);color:#1e1a14;
  box-shadow:0 0 14px rgba(184,134,11,.55);}
.sb-circle{display:flex;align-items:center;justify-content:center;
  width:34px;height:34px;border-radius:50%;
  border:1.5px solid rgba(212,196,168,.5);
  font-family:"Noto Sans TC",sans-serif;font-size:17.5px;font-weight:600;}
.sb-item.active .sb-circle{border-color:#1e1a14;background:#fffdf7;}
.sb-label{font-family:"Noto Sans TC",sans-serif;font-size:12px;letter-spacing:.3px;
  text-align:center;opacity:.9;line-height:1.3;}

/* ── 側欄 tooltip（fixed，掛 body）── */
#sbTip{position:fixed;z-index:300;pointer-events:none;
  max-width:280px;background:rgba(30,26,20,.97);color:#f0e6d2;
  border:1px solid rgba(184,134,11,.5);border-radius:10px;
  padding:10px 14px;box-shadow:0 6px 22px rgba(0,0,0,.35);
  font-family:"Noto Sans TC",sans-serif;opacity:0;transform:translateX(-6px);
  transition:opacity .18s,transform .18s;}
#sbTip.show{opacity:1;transform:translateX(0);}
#sbTip .tip-name{font-size:14px;font-weight:700;color:var(--goldL);margin-bottom:4px;}
#sbTip .tip-text{font-size:12.5px;line-height:1.6;color:#d8cdb6;}

#sbToggle{display:none;}

/* ── 主區 ── */
.main{margin-left:var(--sbW);}
.site-hero{position:relative;background:var(--headGrad);color:#f3ecd8;
  text-align:center;padding:74px 28px 64px;overflow:hidden;}
.site-hero::before{content:"般若";position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);font-size:280px;font-weight:900;
  color:rgba(212,168,75,.04);white-space:nowrap;pointer-events:none;z-index:0;}
.site-hero>*{position:relative;z-index:1;}
.hero-eyebrow{font-family:"Noto Sans TC",sans-serif;font-size:13px;letter-spacing:6px;
  color:var(--goldL);opacity:.85;text-transform:uppercase;}
.hero-book{font-family:"Noto Sans TC",sans-serif;font-size:18px;letter-spacing:4px;
  color:var(--goldL);margin-top:10px;}
.hero-title{font-size:56px;font-weight:900;letter-spacing:8px;margin:14px 0 6px;color:#f3ecd8;}
.hero-sub{font-size:20px;color:#e3d6b8;letter-spacing:1px;margin-bottom:14px;}
.hero-skt{font-family:Georgia,serif;font-style:italic;font-size:15px;color:#c9b888;opacity:.8;}
.hero-range{display:inline-block;margin-top:20px;font-family:"Noto Sans TC",sans-serif;
  font-size:14px;letter-spacing:2px;color:var(--goldL);
  border:1px solid rgba(184,134,11,.4);border-radius:20px;padding:7px 20px;}

/* ── 前言 ── */
.preface{max-width:880px;margin:46px auto 0;padding:0 28px;}
.preface-title{text-align:center;font-size:30px;font-weight:700;color:var(--accent);
  letter-spacing:4px;margin-bottom:22px;}
.preface-title::after{content:"";display:block;width:60px;height:3px;
  background:var(--gold);margin:14px auto 0;border-radius:2px;}
.preface p{font-size:19px;line-height:2.1;color:var(--text2);margin:0 0 16px;text-align:justify;}
.preface strong{color:var(--accent-red);font-weight:700;}

/* ── 總目錄 ── */
.toc-section{max-width:1100px;margin:50px auto 10px;padding:0 28px;}
.toc-title{text-align:center;font-size:34px;font-weight:700;color:var(--accent);letter-spacing:8px;}
.toc-title::after{content:"";display:block;width:60px;height:3px;
  background:var(--gold);margin:14px auto 0;border-radius:2px;}
.toc-desc{text-align:center;font-family:"Noto Sans TC",sans-serif;font-size:15px;
  color:var(--text-muted);letter-spacing:2px;margin:14px 0 28px;}
.toc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;}
.toc-card{display:flex;gap:14px;align-items:flex-start;text-decoration:none;
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:18px 20px;box-shadow:0 1px 4px rgba(91,58,41,.06);
  transition:transform .2s,box-shadow .2s,border-color .2s;}
.toc-card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(91,58,41,.13);
  border-color:var(--gold);}
.toc-num{flex:none;display:flex;align-items:center;justify-content:center;
  width:40px;height:40px;border-radius:50%;background:var(--gold);color:#fff;
  font-family:"Noto Sans TC",sans-serif;font-size:18px;font-weight:700;}
.toc-body{display:flex;flex-direction:column;}
.toc-name{font-size:19.5px;font-weight:700;color:var(--accent);line-height:1.5;}
.toc-sub{font-family:"Noto Sans TC",sans-serif;font-size:13.5px;color:var(--text-muted);
  line-height:1.7;margin-top:6px;}

/* ── 章節（品）── */
.chapter{margin:42px 0 0;}
.ch-head{background:var(--headGrad);color:#f3ecd8;text-align:center;
  padding:46px 28px 40px;position:relative;}
.ch-head::after{content:"";display:block;width:70px;height:3px;
  background:var(--gold);margin:18px auto 0;border-radius:2px;}
.ch-num{font-family:"Noto Sans TC",sans-serif;font-size:18px;letter-spacing:4px;
  color:var(--goldL);}
.ch-name{font-size:34px;font-weight:900;letter-spacing:3px;margin:12px 0 8px;color:#f3ecd8;}
.ch-sub{font-family:"Noto Sans TC",sans-serif;font-size:16px;letter-spacing:1px;
  color:#d8c79e;max-width:760px;margin:0 auto;line-height:1.7;}
.ch-body{max-width:980px;margin:0 auto;padding:30px 24px 10px;}

/* ── 橋接 ── */
.bridge{background:linear-gradient(135deg,#fffdf5,#f5ecd8);border:1px solid var(--border);
  border-left:5px solid var(--gold);border-radius:10px;padding:18px 24px;margin:0 0 26px;
  box-shadow:0 2px 10px rgba(91,58,41,.06);}
.bridge-outro{border-left-color:var(--accentL);
  background:linear-gradient(135deg,#fdf8e8,#f2e6c8);margin-top:30px;margin-bottom:14px;}
.bridge-label{display:inline-block;font-family:"Noto Sans TC",sans-serif;font-size:12.5px;
  background:var(--gold);color:#fff;padding:3px 12px;border-radius:12px;
  letter-spacing:2.2px;margin-bottom:10px;}
.bridge-outro .bridge-label{background:var(--accent);}
.bridge p{margin:0;color:var(--text2);line-height:2.1;font-size:18.5px;}

/* ── iframe ── */
.ch-frame{display:block;width:100%;border:0;background:#fffdf7;
  border:1px solid var(--border);border-radius:12px;
  box-shadow:0 4px 20px rgba(91,58,41,.1);margin:0 0 8px;min-height:180px;}
.next-link{display:inline-block;margin:6px 0 0;font-family:"Noto Sans TC",sans-serif;
  font-size:17px;color:var(--accent);text-decoration:none;
  border:1px solid var(--gold);border-radius:22px;padding:8px 22px;
  transition:background .2s,color .2s;}
.next-link:hover{background:var(--gold);color:#fff;}

/* ── 底部進度膠囊 ── */
.read-progress{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
  z-index:120;background:rgba(30,26,20,.92);color:var(--gold);
  padding:9px 24px;border-radius:30px;border:1px solid rgba(184,134,11,.5);
  box-shadow:0 4px 18px rgba(0,0,0,.25);font-family:"Noto Sans TC",sans-serif;
  font-size:14px;letter-spacing:2px;display:flex;align-items:center;gap:12px;
  pointer-events:none;user-select:none;backdrop-filter:blur(6px);
  transition:opacity .45s ease,transform .45s ease;}
.read-progress.hide-near-end{opacity:0;transform:translateX(-50%) translateY(28px);}
.read-progress .rp-bar{width:148px;height:4px;background:rgba(212,196,168,.18);
  border-radius:2px;overflow:hidden;position:relative;}
.read-progress .rp-fill{position:absolute;top:0;left:0;bottom:0;
  background:linear-gradient(90deg,var(--gold),var(--goldL));width:0%;transition:width .3s;}
.read-progress .rp-pct{font-weight:600;min-width:38px;text-align:right;font-size:13px;}
.read-progress .rp-label{font-size:13px;opacity:.85;letter-spacing:4px;color:var(--goldL);}

/* ── 回頂 ── */
#backTop{position:fixed;right:24px;bottom:22px;width:44px;height:44px;border:0;
  border-radius:50%;background:var(--accent);color:#fff;font-size:20px;cursor:pointer;
  display:none;align-items:center;justify-content:center;z-index:120;
  box-shadow:0 4px 14px rgba(0,0,0,.25);transition:background .2s;}
#backTop:hover{background:var(--gold);}

/* ── 頁尾 ── */
.site-footer{background:var(--headGrad);color:#cdbf9e;text-align:center;
  padding:40px 24px;margin-top:50px;}
.site-footer .ft-1{font-family:"Noto Sans TC",sans-serif;font-size:15px;
  letter-spacing:3px;color:var(--goldL);}
.site-footer .ft-2{font-size:16px;margin-top:12px;line-height:1.9;color:#d8c79e;}

/* ── RWD ── */
@media(max-width:900px){
  #sb{transform:translateX(-100%);transition:transform .3s;width:200px;}
  #sb.open{transform:translateX(0);}
  .main{margin-left:0;}
  #sbToggle{display:flex;position:fixed;left:12px;top:12px;z-index:130;
    width:42px;height:42px;border:0;border-radius:10px;background:var(--sbBg);
    color:var(--goldL);font-size:20px;align-items:center;justify-content:center;cursor:pointer;}
  .hero-title{font-size:40px;}
  .ch-name{font-size:27px;}
  #sbTip{display:none;}
}
@media(max-width:600px){
  body{font-size:17px;}
  .hero-title{font-size:32px;letter-spacing:4px;}
  .toc-grid{grid-template-columns:1fr;}
}

<script>
/* ── 進度條 ── */
var rpFill=document.getElementById('rpFill'),rpPct=document.getElementById('rpPct');
function updateProgress(){
  var sh=document.documentElement.scrollHeight-window.innerHeight;
  var pct=sh>0?Math.min(100,Math.max(0,window.scrollY/sh*100)):0;
  if(rpFill)rpFill.style.width=pct+'%';
  if(rpPct)rpPct.textContent=Math.round(pct)+'%';
}
window.addEventListener('scroll',updateProgress,{passive:true});
updateProgress();

/* ── 接近頁尾淡出 ── */
(function(){
  var cap=document.getElementById('readProgress');if(!cap)return;
  function setHide(on){cap.classList.toggle('hide-near-end',!!on);}
  var f=document.querySelector('.site-footer');if(!f)return;
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(es){
      setHide(es.some(function(e){return e.isIntersecting;}));
    },{root:null,rootMargin:'0px 0px -20px 0px',threshold:0.01});
    io.observe(f);
  }
})();

/* ── iframe 自動高度 ── */
function resizeFrame(f){
  try{
    var d=f.contentDocument||f.contentWindow.document;
    if(!d||!d.body)return;
    d.body.style.minHeight='0';d.body.style.height='auto';
    if(d.documentElement){d.documentElement.style.minHeight='0';d.documentElement.style.height='auto';}
    var h=d.body.scrollHeight;
    if(h>100){f.style.height=h+'px';f.style.minHeight='0';}
  }catch(e){}
}
function resizeAllFrames(){
  document.querySelectorAll('iframe.ch-frame').forEach(resizeFrame);
  if(typeof updateProgress==='function')updateProgress();
}
function setupFrame(f){
  var tries=0;
  function tick(){tries++;resizeFrame(f);if(tries<30)setTimeout(tick,200);}
  if(f.contentDocument&&f.contentDocument.readyState==='complete'){tick();}
  else{f.addEventListener('load',tick);}
}
document.querySelectorAll('iframe.ch-frame').forEach(setupFrame);
var rzT;
window.addEventListener('resize',function(){clearTimeout(rzT);rzT=setTimeout(resizeAllFrames,200);});

/* ── 錨點點擊防跳錯 ── */
document.addEventListener('click',function(e){
  var a=e.target;while(a&&a.tagName!=='A')a=a.parentElement;
  if(!a)return;var h=a.getAttribute('href');
  if(!h||h.charAt(0)!=='#'||h.length<2)return;
  var id=h.substring(1);var el=document.getElementById(id);if(!el)return;
  e.preventDefault();
  resizeAllFrames();
  setTimeout(function(){
    resizeAllFrames();
    var rect=el.getBoundingClientRect();
    var y=window.scrollY+rect.top-20;
    window.scrollTo({top:y,behavior:'smooth'});
    var sb=document.getElementById('sb');if(sb)sb.classList.remove('open');
  },60);
},true);

var _rt=0,_riv=setInterval(function(){_rt++;resizeAllFrames();if(_rt>50)clearInterval(_riv);},300);

/* ── 回頂 ── */
var backTop=document.getElementById('backTop');
window.addEventListener('scroll',function(){
  if(backTop)backTop.style.display=window.scrollY>600?'flex':'none';
},{passive:true});
if(backTop)backTop.addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'});});
var sbBrand=document.getElementById('sbBrand');
if(sbBrand)sbBrand.addEventListener('click',function(e){e.preventDefault();window.scrollTo({top:0,behavior:'smooth'});});

/* ── 漢堡 ── */
var sbToggle=document.getElementById('sbToggle');
if(sbToggle)sbToggle.addEventListener('click',function(){
  document.getElementById('sb').classList.toggle('open');
});

/* ── 側欄高亮 + 目前閱讀 ── */
var items=Array.prototype.slice.call(document.querySelectorAll('.sb-item'));
var nowName=document.getElementById('sbNowName'),nowFill=document.getElementById('sbNowFill');
function highlight(){
  var chs=document.querySelectorAll('section.chapter');
  var act=-1;
  for(var i=0;i<chs.length;i++){
    if(chs[i].getBoundingClientRect().top<window.innerHeight*0.35)act=i;
  }
  items.forEach(function(it,idx){it.classList.toggle('active',idx===act);});
  if(act<0){
    if(nowName)nowName.textContent='編者前言 · 總目錄';
    if(nowFill)nowFill.style.width='0%';
  }else{
    var it=items[act];
    if(nowName&&it)nowName.textContent=(it.getAttribute('data-juan')||'')+' · '+(it.getAttribute('data-name')||'');
    var sec=chs[act];
    var rc=sec.getBoundingClientRect();
    var range=Math.max(1,sec.offsetHeight-window.innerHeight);
    var p=Math.max(0,Math.min(100,(-rc.top)/range*100));
    if(nowFill)nowFill.style.width=p+'%';
    if(it){var sb=document.getElementById('sb');
      var r=it.getBoundingClientRect();
      if(r.top<70||r.bottom>window.innerHeight-20){it.scrollIntoView({block:'center'});}}
  }
}
window.addEventListener('scroll',highlight,{passive:true});
setTimeout(highlight,400);

/* ── 側欄 tooltip ── */
var tip=document.getElementById('sbTip');
var tipName=tip?tip.querySelector('.tip-name'):null;
var tipText=tip?tip.querySelector('.tip-text'):null;
items.forEach(function(it){
  it.addEventListener('mouseenter',function(){
    if(!tip)return;
    if(tipName)tipName.textContent=it.getAttribute('data-name')||'';
    if(tipText)tipText.textContent=it.getAttribute('data-tip')||'';
    var r=it.getBoundingClientRect();
    tip.style.left=(r.right+10)+'px';
    var y=r.top+r.height/2;
    tip.classList.add('show');
    var th=tip.offsetHeight;
    y=Math.max(10+th/2,Math.min(window.innerHeight-10-th/2,y));
    tip.style.top=(y-th/2)+'px';
  });
  it.addEventListener('mouseleave',function(){if(tip)tip.classList.remove('show');});
});
window.addEventListener('scroll',function(){if(tip)tip.classList.remove('show');},{passive:true});

/* ── 防複製 ── */
(function(){
  var blk=function(e){e.preventDefault();return false;};
  ['contextmenu','copy','cut','selectstart','dragstart'].forEach(function(ev){
    document.addEventListener(ev,blk,true);
  });
  document.addEventListener('keydown',function(e){
    var k=e.key;
    if(e.ctrlKey&&(k==='c'||k==='C'||k==='a'||k==='A'||k==='s'||k==='S'||k==='p'||k==='P'||k==='u'||k==='U'||k==='x'||k==='X'))blk(e);
    if(k==='F12')blk(e);
    if(e.ctrlKey&&e.shiftKey&&(k==='I'||k==='J'||k==='C'||k==='K'))blk(e);
  },true);
})();
</script>
<script id="wy-print-intercept">
(function(){
  try{ window.print = function(){}; }catch(e){}
  document.addEventListener("keydown", function(e){
    if((e.metaKey||e.ctrlKey) && (e.key==="p"||e.key==="P"||e.keyCode===80)){
      e.preventDefault(); e.stopPropagation();
      return false;
    }
  }, true);
})();
</script>
<script id="wy-decoder">
(function(){
  if(!window.__wyReady) return;
  var KEY = "wy-dazhidulun-82-v1";
  function _dec(b64){
    try{
      var raw = atob(b64);
      var bytes = new Uint8Array(raw.length);
      for(var i=0;i<raw.length;i++){
        bytes[i] = (raw.charCodeAt(i) ^ KEY.charCodeAt(i % KEY.length)) & 0xff;
      }
      if(typeof TextDecoder !== "undefined"){
        return new TextDecoder("utf-8").decode(bytes);
      }
      var s = "";
      for(var j=0;j<bytes.length;j++) s += String.fromCharCode(bytes[j]);
      return decodeURIComponent(escape(s));
    }catch(e){ return null; }
  }
  window.__wyReady.then(function(ok){
    if(!ok) return;
    document.querySelectorAll("iframe.ch-frame[data-c]").forEach(function(oldF){
      var decoded = _dec(oldF.getAttribute("data-c"));
      if(!decoded) return;
      var newF = document.createElement("iframe");
      for(var i=0;i<oldF.attributes.length;i++){
        var a = oldF.attributes[i];
        if(a.name === "data-c" || a.name === "srcdoc") continue;
        try{ newF.setAttribute(a.name, a.value); }catch(e){}
      }
      newF.setAttribute("srcdoc", decoded);
      try{ oldF.parentNode.replaceChild(newF, oldF); }catch(e){ return; }
      if(typeof window.setupFrame === "function"){
        try{ window.setupFrame(newF); }catch(e){}
      }
    });
    document.querySelectorAll("[data-wytext]").forEach(function(el){
      var t = _dec(el.getAttribute("data-wytext"));
      if(t === null) return;
      el.innerHTML = t;
      el.removeAttribute("data-wytext");
    });
    if(typeof window.resizeAllFrames === "function"){
      [150, 800, 2000].forEach(function(ms){
        setTimeout(function(){ try{ window.resizeAllFrames(); }catch(e){} }, ms);
      });
    }
  });
})();
</script>

<script id="wy-attr-decoder">
(function(){
  if(!window.__wyReady) return;
  var KEY="wy-dazhidulun-82-v1";
  function _dec(b64){try{var raw=atob(b64);var b=new Uint8Array(raw.length);
    for(var i=0;i<raw.length;i++){b[i]=(raw.charCodeAt(i)^KEY.charCodeAt(i%KEY.length))&0xff;}
    return new TextDecoder("utf-8").decode(b);}catch(e){return null;}}
  window.__wyReady.then(function(ok){
    if(!ok) return;
    document.querySelectorAll(".sb-item[data-nc]").forEach(function(el){
      var m={"data-nc":"data-name","data-tc":"data-tip","data-jc":"data-juan"};
      Object.keys(m).forEach(function(k){
        var v=el.getAttribute(k); if(v===null) return;
        var d=_dec(v); if(d!==null){el.setAttribute(m[k],d); el.removeAttribute(k);}
      });
    });
    try{var h=document.documentElement.getAttribute("data-wyt");
      if(h){var t=_dec(h); if(t){document.title=t;} document.documentElement.removeAttribute("data-wyt");}
    }catch(e){}
  });
})();
</script>
